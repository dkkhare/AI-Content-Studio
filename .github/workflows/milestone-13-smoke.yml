name: Milestone 13 Smoke

on:
  push:
    branches:
      - agent/milestone-13-ai-models
  pull_request:
    paths:
      - "backend/ai/**"
      - "backend/episodes/**"
      - "backend/knowledge/**"
      - "backend/story/**"
      - "backend/pipeline/**"
      - "backend/tts/**"
      - "backend/project/project.py"
      - "desktop/ui/dialogs/**"
      - "desktop/ui/widgets/**"
      - "desktop/ui/workspace.py"
      - "tests/test_ai_core.py"
      - "tests/test_ai_providers.py"
      - "tests/test_ai_prompts.py"
      - "tests/test_ai_pipeline_stages.py"
      - "tests/test_episode_segmentation.py"
      - "tests/test_episode_review.py"
      - "tests/test_episode_narration.py"
      - "tests/test_knowledge_store.py"
      - "tests/test_story_intelligence.py"
      - "tests/test_f5tts_runtime.py"
      - "tests/test_pipeline_factory.py"
      - ".github/workflows/milestone-13-smoke.yml"

jobs:
  ai-core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python sources
        run: python -m compileall -q backend desktop tests

      - name: Run Milestone 13 AI and local media tests
        run: >-
          python -m unittest -v
          tests.test_ai_core
          tests.test_ai_providers
          tests.test_ai_prompts
          tests.test_ai_pipeline_stages
          tests.test_episode_segmentation
          tests.test_episode_review
          tests.test_episode_narration
          tests.test_knowledge_store
          tests.test_story_intelligence
          tests.test_f5tts_runtime

      - name: Re-run Milestone 12 processing regressions
        run: >-
          python -m unittest -v
          tests.test_processing_pipeline
          tests.test_processing_stages
          tests.test_pipeline_factory
          tests.test_translation_provider
          tests.test_video_renderer

      - name: Re-run Milestone 11 lifecycle regression
        run: python -m unittest -v tests.test_project_lifecycle
