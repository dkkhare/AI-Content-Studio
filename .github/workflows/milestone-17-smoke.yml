name: Milestone 17 Video Composer

on:
  pull_request:
    paths:
      - "backend/video/**"
      - "desktop/controllers/video_controller.py"
      - "desktop/ui/widgets/video_panel.py"
      - "desktop/ui/workspace.py"
      - "tests/test_video_composer.py"
      - "tests/test_video_desktop.py"
      - ".github/workflows/milestone-17-smoke.yml"
  workflow_dispatch:

jobs:
  video-composer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile video modules and tests
        run: python -m compileall -q backend/video tests/test_video_composer.py
      - name: Run video composer regressions
        run: python -m unittest -v tests.test_video_composer
