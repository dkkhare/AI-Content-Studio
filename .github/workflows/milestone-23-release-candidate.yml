name: Milestone 23 Release Candidate

on:
  pull_request:
    paths:
      - "backend/**"
      - "desktop/**"
      - "packaging/**"
      - "AIContentStudio.spec"
      - "requirements-build.txt"
      - "scripts/release_evidence.py"
      - "scripts/release_version.py"
      - "tests/**"
      - "docs/MILESTONE_23_RELEASE_READINESS.md"
      - "docs/release-candidate-template.md"
      - ".github/workflows/milestone-23-release-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance-contract:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1
          python -m pip install PySide6
      - name: Compile acceptance code
        run: python -m compileall -q backend desktop scripts/release_evidence.py scripts/release_version.py tests
      - name: Run project and AI regressions
        run: >-
          python -m unittest -v
          tests.test_project_lifecycle tests.test_ai_core
          tests.test_ai_hardening tests.test_ai_pipeline_stages
          tests.test_ai_prompts tests.test_ai_providers
      - name: Run update and support regressions
        run: >-
          python -m unittest -v
          tests.test_updating tests.test_update_download
          tests.test_update_desktop tests.test_update_dialog
          tests.test_supporting tests.test_support_runtime
      - name: Run release contract regressions
        run: >-
          python -m unittest -v
          tests.test_runtime tests.test_release_version
          tests.test_release_workflows tests.test_release_evidence

  windows-acceptance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $Version = python scripts/release_version.py
          if ($LASTEXITCODE -ne 0 -or -not $Version) {
            throw "Unable to resolve application version"
          }
          "APP_VERSION=$Version" | Out-File $env:GITHUB_ENV -Append
          "version=$Version" | Out-File $env:GITHUB_OUTPUT -Append
      - name: Install Windows build tools
        shell: pwsh
        run: |
          python -m pip install PySide6 -r requirements-build.txt
          choco install innosetup --yes --no-progress
      - name: Build application bundle
        run: python -m PyInstaller --noconfirm --clean AIContentStudio.spec
      - name: Verify packaged diagnostics and GUI lifecycle
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          AI_CONTENT_STUDIO_DISABLE_UPDATE_CHECKS: "1"
        run: |
          $Executable = (Resolve-Path "dist\AIContentStudio\AIContentStudio.exe").Path
          $Checks = @(
            @{ Args = @("--diagnostics", "packaged-diagnostics.json"); Report = "packaged-diagnostics.json" },
            @{ Args = @("--smoke-gui", "gui-smoke.json"); Report = "gui-smoke.json" },
            @{ Args = @("--smoke-update-ui", "update-ui-smoke.json"); Report = "update-ui-smoke.json" }
          )
          foreach ($Check in $Checks) {
            $Process = Start-Process -FilePath $Executable -ArgumentList $Check.Args -Wait -PassThru
            if ($Process.ExitCode -ne 0 -or -not (Test-Path $Check.Report)) {
              throw "Packaged check failed: $($Check.Report)"
            }
          }
          $Diagnostics = Get-Content packaged-diagnostics.json | ConvertFrom-Json
          if (-not $Diagnostics.frozen -or -not $Diagnostics.resources_available -or $Diagnostics.version -ne $env:APP_VERSION) {
            throw "Packaged diagnostics validation failed"
          }
          $Gui = Get-Content gui-smoke.json | ConvertFrom-Json
          if (-not $Gui.started -or -not $Gui.shutdown -or $Gui.exit_code -ne 0) {
            throw "Packaged GUI lifecycle validation failed"
          }
          $Update = Get-Content update-ui-smoke.json | ConvertFrom-Json
          if (-not $Update.update_action_available -or -not $Update.update_dialog_created -or -not $Update.network_update_checks_disabled -or -not $Update.shutdown -or $Update.exit_code -ne 0) {
            throw "Packaged update UI validation failed"
          }
      - name: Generate bundle checksum manifest
        shell: pwsh
        run: |
          $Root = (Resolve-Path "dist\AIContentStudio").Path
          Get-ChildItem $Root -File -Recurse | Sort-Object FullName | ForEach-Object {
            $Hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $Relative = [System.IO.Path]::GetRelativePath($Root, $_.FullName)
            "$Hash  $Relative"
          } | Set-Content (Join-Path $Root "SHA256SUMS.txt") -Encoding utf8
      - name: Compile installer
        shell: pwsh
        run: |
          $CompilerCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:ChocolateyInstall\bin\ISCC.exe"
          )
          $Compiler = $CompilerCandidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $Compiler) {
            throw "Inno Setup 6 compiler was not found"
          }
          & $Compiler "/DMyAppVersion=$env:APP_VERSION" "packaging\AIContentStudio.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }
      - name: Install, verify, and uninstall
        shell: pwsh
        run: |
          $Installer = (Resolve-Path "release\AIContentStudio-Setup-$env:APP_VERSION-windows-x64.exe").Path
          $InstallDir = Join-Path $env:RUNNER_TEMP "AIContentStudio-installed"
          $Install = Start-Process -FilePath $Installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$InstallDir" -Wait -PassThru
          if ($Install.ExitCode -ne 0) {
            throw "Installer failed with exit code $($Install.ExitCode)"
          }
          $Executable = Join-Path $InstallDir "AIContentStudio.exe"
          $Diagnostics = Join-Path $env:RUNNER_TEMP "installed-diagnostics.json"
          $Check = Start-Process -FilePath $Executable -ArgumentList "--diagnostics", $Diagnostics -Wait -PassThru
          if ($Check.ExitCode -ne 0) {
            throw "Installed diagnostics failed with exit code $($Check.ExitCode)"
          }
          $Report = Get-Content $Diagnostics | ConvertFrom-Json
          if (-not $Report.frozen -or -not $Report.resources_available -or $Report.version -ne $env:APP_VERSION) {
            throw "Installed application validation failed"
          }
          $Uninstaller = Join-Path $InstallDir "unins000.exe"
          $Remove = Start-Process -FilePath $Uninstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($Remove.ExitCode -ne 0) {
            throw "Uninstaller failed with exit code $($Remove.ExitCode)"
          }
          Start-Sleep -Seconds 2
          if (Test-Path $Executable) {
            throw "Application executable remained after uninstall"
          }
      - name: Generate installer checksum
        shell: pwsh
        run: |
          $Installer = Resolve-Path "release\AIContentStudio-Setup-$env:APP_VERSION-windows-x64.exe"
          $Hash = (Get-FileHash $Installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$Hash  $($Installer.Path | Split-Path -Leaf)" | Set-Content "release\SHA256SUMS.txt" -Encoding utf8
      - name: Upload verified Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: milestone-23-windows-${{ steps.version.outputs.version }}
          path: |
            dist/AIContentStudio/
            release/AIContentStudio-Setup-*-windows-x64.exe
            release/SHA256SUMS.txt
          if-no-files-found: error

  release-evidence:
    needs:
      - acceptance-contract
      - windows-acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate ready release evidence
        run: >-
          python -m scripts.release_evidence
          --output release-evidence.json
          --commit "$GITHUB_SHA"
          --gate project_lifecycle=pass
          --gate ai_core=pass
          --gate safe_updates=pass
          --gate support_diagnostics=pass
          --gate windows_package=pass
          --gate windows_installer=pass
          --require-ready
      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: milestone-23-release-evidence
          path: release-evidence.json
          if-no-files-found: error
