name: Milestone 21 Safe Updates

on:
  pull_request:
    paths:
      - "backend/updating/**"
      - "backend/version.py"
      - "desktop/controllers/update_controller.py"
      - "desktop/settings/update_preferences.py"
      - "desktop/settings/__init__.py"
      - "tests/test_updating.py"
      - "tests/test_update_download.py desktop/controllers/update_controller.py desktop/settings/update_preferences.py tests/test_update_desktop.py"
      - "tests/test_update_desktop.py"
      - ".github/workflows/milestone-21-updates.yml"
  workflow_dispatch:

jobs:
  update-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install desktop test dependency
        run: python -m pip install PySide6
      - name: Compile update modules
        run: python -m compileall -q backend/updating tests/test_updating.py tests/test_update_download.py
      - name: Run update regressions
        run: python -m unittest -v tests.test_updating tests.test_update_download tests.test_update_desktop
