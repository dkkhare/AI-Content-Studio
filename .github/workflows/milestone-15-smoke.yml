name: Milestone 15 TTS Narration

on:
  push:
    branches:
      - agent/milestone-15-tts-narration
  pull_request:
    paths:
      - "backend/tts/**"
      - "desktop/controllers/tts_controller.py"
      - "desktop/workers/tts_worker.py"
      - "desktop/ui/widgets/narration_panel.py"
      - "tests/test_tts_*.py"
      - ".github/workflows/milestone-15-smoke.yml"

jobs:
  tts-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1

      - name: Install TTS desktop runtime
        run: python -m pip install --disable-pip-version-check numpy pydub soundfile PySide6

      - name: Compile TTS integration
        run: python -m compileall -q backend/tts desktop tests

      - name: Run TTS core regressions
        run: python -m unittest -v tests.test_tts_core

      - name: Verify pipeline imports without optional F5 runtime
        run: python -c "from backend.tts.pipeline import TTSPipeline; print('TTS pipeline import OK')"

      - name: Run offscreen narration UI regressions
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest -v tests.test_tts_qt
