name: Milestone 20 Windows Installer

on:
  pull_request:
    paths:
      - "backend/version.py"
      - "desktop/**"
      - "AIContentStudio.spec"
      - "requirements-build.txt"
      - "packaging/**"
      - "scripts/build_installer.ps1"
      - "scripts/release_version.py"
      - ".github/workflows/milestone-20-windows-installer.yml"
  workflow_dispatch:

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $Version = python scripts/release_version.py
          if ($LASTEXITCODE -ne 0 -or -not $Version) {
            throw "Unable to resolve application version"
          }
          "APP_VERSION=$Version" | Out-File $env:GITHUB_ENV -Append
          "version=$Version" | Out-File $env:GITHUB_OUTPUT -Append
      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install PySide6 -r requirements-build.txt
          choco install innosetup --yes --no-progress
      - name: Build application bundle
        run: python -m PyInstaller --noconfirm --clean AIContentStudio.spec
      - name: Compile installer
        shell: pwsh
        run: |
          $CompilerCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:ChocolateyInstall\bin\ISCC.exe"
          )
          $Compiler = $CompilerCandidates |
            Where-Object { $_ -and (Test-Path $_) } |
            Select-Object -First 1
          if (-not $Compiler) {
            throw "Inno Setup 6 compiler was not found."
          }
          & $Compiler "/DMyAppVersion=$env:APP_VERSION" "packaging\AIContentStudio.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }
      - name: Install and verify application
        shell: pwsh
        run: |
          $Installer = Resolve-Path "release\AIContentStudio-Setup-$env:APP_VERSION-windows-x64.exe"
          $InstallDir = Join-Path $env:RUNNER_TEMP "AIContentStudio-installed"
          $Install = Start-Process -FilePath $Installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$InstallDir" -Wait -PassThru
          if ($Install.ExitCode -ne 0) {
            throw "Installer failed with exit code $($Install.ExitCode)"
          }
          $Executable = Join-Path $InstallDir "AIContentStudio.exe"
          if (-not (Test-Path $Executable)) {
            throw "Installed executable was not found"
          }
          $Diagnostics = Join-Path $env:RUNNER_TEMP "installed-diagnostics.json"
          $Check = Start-Process -FilePath $Executable -ArgumentList "--diagnostics", $Diagnostics -Wait -PassThru
          if ($Check.ExitCode -ne 0) {
            throw "Installed diagnostics failed with exit code $($Check.ExitCode)"
          }
          $Report = Get-Content $Diagnostics | ConvertFrom-Json
          if (-not $Report.frozen -or -not $Report.resources_available) {
            throw "Installed application failed runtime validation"
          }
          $Uninstaller = Join-Path $InstallDir "unins000.exe"
          $Remove = Start-Process -FilePath $Uninstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($Remove.ExitCode -ne 0) {
            throw "Uninstaller failed with exit code $($Remove.ExitCode)"
          }
          Start-Sleep -Seconds 2
          if (Test-Path $Executable) {
            throw "Application executable remained after uninstall"
          }
      - name: Generate installer checksum
        shell: pwsh
        run: |
          $Installer = Resolve-Path "release\AIContentStudio-Setup-$env:APP_VERSION-windows-x64.exe"
          $Hash = (Get-FileHash $Installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$Hash  $($Installer.Path | Split-Path -Leaf)" | Set-Content "release\SHA256SUMS.txt" -Encoding utf8
      - name: Upload verified installer
        uses: actions/upload-artifact@v4
        with:
          name: AIContentStudio-Setup-${{ steps.version.outputs.version }}-windows-x64
          path: |
            release/AIContentStudio-Setup-*-windows-x64.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
