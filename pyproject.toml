[tool.poetry]
name = "ai-content-studio"
version = "0.1.0"
description = "Offline AI Content Creation Studio"
authors = ["Devendra Khare"]

[tool.poetry.dependencies]
python = "^3.11"

PySide6 = "*"
opencv-python = "*"
numpy = "*"
pillow = "*"
moviepy = "*"
ffmpeg-python = "*"
sqlalchemy = "*"
loguru = "*"
rich = "*"
python-dotenv = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true